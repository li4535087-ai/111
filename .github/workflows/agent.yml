name: agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: '交给 dsh 的任务'
        required: true
        default: 'Create a file named proof.txt containing exactly: dsh-cloud-ok'
      profile:
        description: '模式 (headless / tui)'
        required: false
        default: 'headless'

permissions:
  contents: write

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install sandbox backend + dsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          npm install -g @deepseek-ai/dsh \
            --allow-scripts=@deepseek-ai/dsh-subprocess-local,koffi,node-pty,@google/genai,protobufjs
          dsh --version
          echo "bwrap: $(which bwrap)"

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          mkdir -p agent_out
          cd agent_out
          set +e
          timeout 2100 dsh headless "$TASK" > ../agent_log.txt 2>&1
          echo "exit=$?" >> ../agent_log.txt
          set -e
          tail -30 ../agent_log.txt

      - name: Show workspace
        if: always()
        run: |
          echo "=== agent_out ==="
          find agent_out -maxdepth 3 -type f | head -40
          du -sh agent_out || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "dsh-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "agent: run [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: |
            agent_log.txt
            agent_out
          if-no-files-found: warn