name: agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: '交给 dsh 的任务'
        required: true
        default: '列出仓库结构'

permissions:
  contents: write

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime (dsh + puppeteer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          npm install -g @deepseek-ai/dsh \
            --allow-scripts=@deepseek-ai/dsh-subprocess-local,koffi,node-pty,@google/genai,protobufjs
          dsh --version
          npm install --no-audit --no-fund
          node -e "console.log('puppeteer ok', require('puppeteer/package.json').version)"

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_PERMISSION_MODE: danger-full-access
          TASK: ${{ github.event.inputs.task }}
        run: |
          set +e
          timeout 2400 dsh headless "$TASK" > agent_log.txt 2>&1
          echo "exit=$?" >> agent_log.txt
          set -e
          tail -40 agent_log.txt

      - name: Show workspace
        if: always()
        run: |
          echo "=== new files ==="
          git status --porcelain | head -40
          ls -la scenes 2>/dev/null || true
          ls -la agent_out 2>/dev/null || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "dsh-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "agent: run [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Upload log + shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: |
            agent_log.txt
            agent_out
            scenes
          if-no-files-found: warn