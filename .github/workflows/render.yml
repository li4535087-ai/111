name: render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scene:
        description: '场景文件'
        required: false
        default: 'scenes/t3.html'
      name:
        description: '输出文件名（不含扩展名）'
        required: false
        default: 't3'
      seconds:
        description: '时长（秒）'
        required: false
        default: '1'
      width:
        description: '宽'
        required: false
        default: '540'
      height:
        description: '高'
        required: false
        default: '960'
      fps:
        description: '帧率'
        required: false
        default: '24'
      seed:
        description: '随机种子'
        required: false
        default: '20261019'

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  SCENE: ${{ github.event.inputs.scene || 'scenes/t3.html' }}
  NAME: ${{ github.event.inputs.name || 't3' }}
  SECONDS: ${{ github.event.inputs.seconds || '1' }}
  W: ${{ github.event.inputs.width || '540' }}
  H: ${{ github.event.inputs.height || '960' }}
  FPS: ${{ github.event.inputs.fps || '24' }}
  SEED: ${{ github.event.inputs.seed || '20261019' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render frames
        run: node scripts/render.mjs

      - name: Encode video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
          ffmpeg -y -hide_banner -loglevel error \
            -framerate ${FPS} -i frames/%04d.png \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p \
            -movflags +faststart \
            out/${NAME}.mp4
          ls -lh out

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/${{ env.NAME }}.mp4
          if-no-files-found: error

      - name: Commit result back to repo
        run: |
          mkdir -p renders
          cp out/${NAME}.mp4 renders/${NAME}.mp4
          rm -rf frames
          git config user.name "codefilm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders
          git commit -m "render: ${NAME}.mp4 [skip ci]" || echo "nothing to commit"
          git push