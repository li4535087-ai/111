<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#87a7c0}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';

const W = window.innerWidth;
const H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb3cc);
scene.fog = new THREE.Fog(0xa9c4d4, 12, 40);

const cam = new THREE.PerspectiveCamera(45, W / H, 0.1, 120);
cam.position.set(3.2, 2.4, 4.2);
cam.lookAt(0, 0.55, 0);

scene.add(new THREE.HemisphereLight(0xc3dcee, 0x35452a, 0.85));

const sun = new THREE.DirectionalLight(0xffe9c4, 2.4);
sun.position.set(4.5, 7.5, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0x5d7a3a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const boxMat = new THREE.MeshStandardMaterial({ color: 0xb06a4a, roughness: 0.8 });
const box = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), boxMat);
box.position.y = 0.55;
box.castShadow = true;
box.receiveShadow = true;
scene.add(box);

const ballMat = new THREE.MeshStandardMaterial({ color: 0x5f7fa8, roughness: 0.35 });
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 24), ballMat);
ball.position.set(-1.3, 0.42, 0.4);
ball.castShadow = true;
scene.add(ball);

window.renderFrame = (t) => {
  box.rotation.y = t * 0.8;
  box.position.y = 0.55 + Math.sin(t * 2) * 0.08;
  ball.position.x = -1.3 + Math.sin(t * 1.1) * 0.3;
  renderer.render(scene, cam);
};

window.renderFrame(0);
window.__ready = true;
</script>
</body></html>
